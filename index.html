<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AmandaMart SQL Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui;
        }
        .welcome-card {
            background: white;
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .btn-dashboard {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn-dashboard:hover {
            transform: translateY(-2px);
            color: white;
        }
        .btn-profit {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn-profit:hover {
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
    <div class="welcome-card">
        <i class="bi bi-database-gear" style="font-size: 60px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
        <h1 class="mt-3 mb-3">AmandaMart</h1>
        <h4 class="text-muted mb-4">SQL Financial Analyzer</h4>
        <p class="text-muted mb-4">Pilih halaman yang ingin Anda akses:</p>
        <div>
            <a href="dashboard.html" class="btn btn-dashboard d-block mb-3">
                <i class="bi bi-speedometer2"></i> Dashboard Utama
            </a>
            <a href="laba-rugi.html" class="btn btn-profit d-block">
                <i class="bi bi-graph-up"></i> Laporan Laba-Rugi
            </a>
        </div>
        <hr class="my-4">
        <small class="text-muted">
            <i class="bi bi-cloud-upload"></i> Upload file SQL untuk memulai analisis
        </small>
    </div>
</body>
</html>
